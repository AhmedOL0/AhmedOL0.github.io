<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0b0b0e; color: #e8e4dc; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .wrap { text-align: center; padding: 2rem; }
    .code { font-size: 6rem; font-weight: 700; color: #c9a96e; line-height: 1; }
    .msg { font-size: 1.1rem; color: #888; margin: 1rem 0 2rem; }
    .link { color: #c9a96e; text-decoration: none; border: 1px solid #c9a96e; padding: .6rem 1.5rem; border-radius: 999px; font-size: .9rem; transition: background .2s, color .2s; }
    .link:hover { background: #c9a96e; color: #0b0b0e; }
  </style>
  <script>
    /* Redirect to root after 3s, or immediately on click */
    setTimeout(function(){ location.replace('/'); }, 3000);
  </script>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <p class="msg">This page doesn't exist. Redirecting to portfolio...</p>
    <a class="link" href="/">Go to portfolio now</a>
  </div>
</body>
</html>
