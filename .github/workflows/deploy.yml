name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - name: Verify secrets available
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$VITE_WEB3FORMS_KEY" ]; then
            echo "✅ WEB3FORMS_KEY is set (length: ${#VITE_WEB3FORMS_KEY})"
          else
            echo "❌ WEB3FORMS_KEY is EMPTY or not set"
            echo "   Go to: Settings → Secrets and variables → Actions → Secrets"
            echo "   Add secret named exactly: WEB3FORMS_KEY"
            echo "   NOT as a Variable: must be a Secret."
            exit 1
          fi
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
      - run: npm run build
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
      # Single-engine smoke in CI (chromium). The full 4-engine suite
      # (firefox, webkit, mobile-chrome) runs locally before shipping.
      - run: npx playwright test --project=chromium

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, e2e]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
